name: PR Studio Lint and Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'studio/**'
      - '.github/workflows/pr-studio-lint-build.yml'

concurrency:
  group: pr-studio-lint-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  studio-lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: studio/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run studio CI checks
        run: yarn ci
