name: Create release PR

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: create-release-pr
  cancel-in-progress: false

jobs:
  release:
    name: Prepare dev → main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}

    steps:
      - name: Require dev
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != 'refs/heads/dev' ]; then
            echo 'Select dev in the Run workflow branch dropdown.'
            exit 1
          fi

      - name: Check App configuration
        env:
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if { [ -n "$RELEASE_APP_ID" ] && [ -z "$RELEASE_APP_PRIVATE_KEY" ]; } || { [ -z "$RELEASE_APP_ID" ] && [ -n "$RELEASE_APP_PRIVATE_KEY" ]; }; then
            echo 'Configure both RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY, or remove both to use GITHUB_TOKEN.'
            exit 1
          fi

      - name: Check out automation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15

      - name: Create GitHub App token
        id: app
        if: ${{ env.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Create or update release PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: node scripts/create-release-pr.mts
