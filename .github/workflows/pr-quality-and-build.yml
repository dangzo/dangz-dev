name: PR Checks

# Disables husky pre-commit hooks on the CI
# https://docs.github.com/en/actions/learn-github-actions/variables
env:
  HUSKY: 0

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: pr-quality-and-build-${{ github.event.pull_request.number || github.ref }}
  # Cancel in-progress runs on push/reopen, and when skip labels are added or removed.
  # Unrelated labels must not cancel a running check.
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' || contains(fromJSON('["skip-ci","skip-lighthouse"]'), github.event.label.name) }}

jobs:
  gate:
    name: Label gates
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Always read labels: skipping this job also skips required checks, which
    # GitHub accepts as passing even when another run is failing or pending.
    outputs:
      skip_ci: ${{ steps.labels.outputs.skip_ci }}
      skip_lighthouse: ${{ steps.labels.outputs.skip_lighthouse }}

    steps:
      - id: labels
        name: Read skip labels
        run: |
          echo "skip_ci=${{ contains(github.event.pull_request.labels.*.name, 'skip-ci') }}" >> "$GITHUB_OUTPUT"
          echo "skip_lighthouse=${{ contains(github.event.pull_request.labels.*.name, 'skip-lighthouse') }}" >> "$GITHUB_OUTPUT"

  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: ${{ needs.gate.outputs.skip_ci != 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Look up dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-24.15-yarn-modules-${{ hashFiles('yarn.lock') }}
          lookup-only: true

      - name: Set up Node.js
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.15
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Save dependencies cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-24.15-yarn-modules-${{ hashFiles('yarn.lock') }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-24.15-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn ci:lint

  test-unit:
    name: Test (Unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-24.15-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test:unit

  test-e2e:
    name: Test (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-24.15-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: Run e2e tests
        run: yarn test:e2e

      - name: Run Umami pageview integration tests
        run: yarn test:e2e:pageviews

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-24.15-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Run type checks
        run: yarn ci:typecheck

  lighthouse-audits:
    name: Lighthouse (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate, build]
    if: ${{ needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.skip_lighthouse != 'true' }}

    strategy:
      fail-fast: false
      matrix:
        preset: [mobile, desktop]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-24.15-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Download Next.js build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Run Lighthouse audit
        run: yarn lhci:${{ matrix.preset }} --collect.startServerCommand="yarn start"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [gate, lighthouse-audits]
    # Run after failed, cancelled, or skipped audits, so the check cannot pass
    # unless both presets succeeded. Skip labels still intentionally skip it.
    if: ${{ always() && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.skip_lighthouse != 'true' }}

    steps:
      - name: Verify Lighthouse audits
        env:
          AUDIT_RESULT: ${{ needs.lighthouse-audits.result }}
        run: |
          if [ "$AUDIT_RESULT" != 'success' ]; then
            echo "Lighthouse audits did not succeed: $AUDIT_RESULT"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-24.15-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Build projects
        run: yarn ci:build

      - name: Upload Next.js build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          if-no-files-found: error
