name: PR Checks

# Disables husky pre-commit hooks on the CI
# https://docs.github.com/en/actions/learn-github-actions/variables
env:
  HUSKY: 0

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - 'src/**'
      - 'public/**'
      - 'studio/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - '*.mjs'
      - '*.cjs'
      - '.github/workflows/pr-quality-and-build.yml'
      - 'yarn.lock'

concurrency:
  group: pr-quality-and-build-${{ github.event.pull_request.number || github.ref }}
  # Cancel in-progress runs on push/reopen, and when skip labels are added or removed.
  # Unrelated labels must not cancel a running check.
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' || contains(fromJSON('["skip-ci","skip-lighthouse"]'), github.event.label.name) }}

jobs:
  gate:
    name: Label gates
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Ignore labeled/unlabeled events that are not skip-ci or skip-lighthouse.
    if: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' || contains(fromJSON('["skip-ci","skip-lighthouse"]'), github.event.label.name) }}
    outputs:
      skip_ci: ${{ steps.labels.outputs.skip_ci }}
      skip_lighthouse: ${{ steps.labels.outputs.skip_lighthouse }}

    steps:
      - id: labels
        name: Read skip labels
        run: |
          echo "skip_ci=${{ contains(github.event.pull_request.labels.*.name, 'skip-ci') }}" >> "$GITHUB_OUTPUT"
          echo "skip_lighthouse=${{ contains(github.event.pull_request.labels.*.name, 'skip-lighthouse') }}" >> "$GITHUB_OUTPUT"

  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: ${{ needs.gate.outputs.skip_ci != 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-22.13-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Save dependencies cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-22.13-yarn-modules-${{ hashFiles('yarn.lock') }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-22.13-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn ci:lint

  test-unit:
    name: Test (Unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-22.13-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test:unit

  test-e2e:
    name: Test (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-22.13-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: Run e2e tests
        run: yarn test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-22.13-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Run type checks
        run: yarn ci:typecheck

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate, setup]
    if: ${{ needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.skip_lighthouse != 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: yarn
          cache-dependency-path: yarn.lock
      
      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-22.13-yarn-modules-${{ hashFiles('yarn.lock') }}
      
      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      
      - name: Lighthouse mobile audit
        run: yarn lhci:mobile
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Lighthouse desktop audit
        run: yarn lhci:desktop
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test-unit, test-e2e, typecheck]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-22.13-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Build projects
        run: yarn ci:build

      - name: Upload Next.js build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          if-no-files-found: error

