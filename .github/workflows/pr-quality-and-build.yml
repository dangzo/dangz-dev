name: PR Checks

# Disables husky pre-commit hooks on the CI
# https://docs.github.com/en/actions/learn-github-actions/variables
env:
  HUSKY: 0

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'public/**'
      - 'studio/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - '*.mjs'
      - '*.cjs'
      - '.github/workflows/pr-quality-and-build.yml'
      - 'yarn.lock'

concurrency:
  group: pr-quality-and-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-22.13-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Save dependencies cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-22.13-yarn-modules-${{ hashFiles('yarn.lock') }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-22.13-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn ci:lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-22.13-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn ci:test

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-22.13-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Run type checks
        run: yarn ci:typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: ${{ runner.os }}-node-22.13-yarn-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Build projects
        run: yarn ci:build
