# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
inheritance: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary_in_walkthrough: true
  review_status: false
  in_progress_fortune: false
  poem: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    description_keyword: ''
    labels:
      - '!skip-review'
      - '!dependencies'
  path_filters:
    - '!src/data/buildVersion.ts'
  path_instructions:
    - path: src/types/sanity.types.ts
      instructions: >-
        This file is generated by Sanity TypeGen. Check consistency with source
        schemas and consumers. Do not suggest manual edits or formatting changes;
        fixes belong in source schemas or generation configuration.
    - path: studio/schema.json
      instructions: >-
        This is an extracted, generated Sanity schema. Check consistency with
        studio/schemaTypes and generation configuration. Do not suggest manual
        edits or formatting changes.
  pre_merge_checks:
    docstrings:
      mode: 'off'

chat:
  auto_reply: false
  art: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - '**/AGENTS.md'
      - files: docs/ARCHITECTURE.md
        applyTo: '**/*'
      - files: docs/WORKFLOW.md
        applyTo: '**/*'
